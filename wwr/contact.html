<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact us for offers guided rafting trips for all levels on the Cauca River.">
    <meta name="author" content="David Reyes">
    <title>Contact Us | Wild River Adventures</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="images/logo.jpeg" alt="logo Wilde River Adventures" width="100" />
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main> 
        <h1 id="about-title">Wild River Adventures</h1>
        <p class="contact-info">11900 US-2, West Glacier, MT 59936</p>
        <p class="contact-info">+140 6886 9463</p>
        <p class="contact-info">info@wildriveradv.com</p>

        <div class="form-container">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2644.673154399147!2d-113.9997618!3d48.481982599999995!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5366226bf2c0ae51%3A0xbac3e4f2199411a9!2sWild%20River%20Adventures!5e0!3m2!1ses!2spy!4v1795815663346!5m2!1ses!2spy" width="300" height="250"   allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <form>
                <fieldset>
                    <div class="form-item label-narrow">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="John Doe">
                    </div>
                    <div class="form-item label-narrow">
                        <label for="useremail">Email</label>
                        <input type="email" id="useremail" name="useremail" placeholder="mail@youremail.com">
                    </div>
                </fieldset>
                <fieldset class="form-item label-narrow message-purpose">
                    <legend>Message<br>Purpose</legend>
                    <div class="purposes">
                        <label>
                            <input type="radio" name="purpose" value="general" id="purpose-general">
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="reservation" id="purpose-reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="suggestion" id="purpose-suggestion">
                            Website Suggestion
                        </label>
                    </div>
                </fieldset>
                <fieldset>
                    <div class="form-item">
                        <label for="message">Message</label>
                        <textarea rows="3" id="message" name="message" placeholder="Type here"></textarea>
                    </div>
                </fieldset>
                <fieldset>
                    <label><input type="checkbox" id="newsletter" name="newsletter"> Please subscribe me to the monthly newsletter</label> 
                    <button type="submit">Get in Touch!</button>
                </fieldset>
                
            </form>
        </div>
  
      
        <section class="our-team-container">
            <h2>We Are Here to Serve You!</h2>
            <div class="our-team">
                <figure>
                    <img class="team-picture" src="images/profile1.jpg" alt="Michael Zaguamba" >
                    <img class="background-team" src="images/rafting26_600.jpg" alt="Quiet River Bend">
                    <figcaption>Michael Zaguamba</figcaption>
                </figure>
                <figure>
                    <img class="team-picture" src="images/profile2.jpg" alt="Lia Jang" >
                    <img class="background-team" src="images/rafting29_600.jpg" alt="The Whitewater Drop">
                    <figcaption>Lia Jang</figcaption>
                </figure>
                 
                <figure>
                    <img class="team-picture" src="images/profile3.jpg" alt="Dalia Souza" >
                    <img class="background-team" src="images/rafting47_600.jpg" alt="Hill Gorge's">
                    <figcaption>Dalia Souza</figcaption>
                </figure>
                

            </div>
        </section>
    </main>

    <footer>
        <p>©2026 🌟 Wild River Adventures 🌟 David Reyes.</p>
        <!-- https://www.magnific.com/icons -->
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook" />
            </a>

            <a href="https://tiktok.com">
                <img src="images/tiktok.png" alt="TikTok" />
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram" />
            </a>
        </nav>
    </footer>
</body>

</html>
