<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | HTML Form - User Poll</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item label-narrow">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname">
                </div>
                <div class="form-item label-narrow">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail">
                </div>
            </fieldset>
            <fieldset>
                <legend>Questions</legend>
                <div class="form-item label-question">
                    <label for="browser">What is your favorite internet browser?</label>
                    <select name="browser" id="browser">
                        <option value="" selected disabled>Choose One ...</option>
                        <option value="1">Chrome</option>
                        <option value="2">Firefox</option>
                        <option value="3">Brave</option>
                    </select>
                </div>
                <div class="form-item label-question">
                    <label for="pet">Do you have a household pet:</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>
                <div class="form-item label-center">
                    <label for=" list">List the places you have lived:</label>
                    <textarea id="list" name="list" rows="4" cols="50" placeholder="Stillwater Florida, Amsterdam Netherlands, Tibuktu Mali"></textarea>
                </div>
            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>

    </main>
    <footer>
        <p>©2026 - HTML Form - User Poll Activity | David Reyes.</p>
    </footer>
</body>

</html>
