<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Exercise</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>Basic HTML and CSS quiz</h1>


        <form>
            <!-- 
                A text type input. (fill in the blank question)
                Assign both the name and id attribute values as "q1".
            -->
            <div class="form-row">
                <label for="q1"><span>1.</span> What does the acronym CSS stand for:</label>
                <input type="text" id="q1" name="q1">
            </div>
            <!--
            A textarea element. (short answer question)
            Assign both the name and id attribute values as "q2".
            -->
            <div class="form-row">
                <label for="q2"><span>2.</span>How are id and class atributes selected in CSS:</label>
                <textarea id="q2" name="q2" rows="4"></textarea>
            </div>
            <!-- A select element. (dropdown or combo box)
                Assign both the name and id attribute values as "q3".
                The select element should have at least three (3) options with values.
             -->
            <div class="form-row">
                <label for="q3"><span>3.</span>Which of the following is a valid CSS comment</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="1">One</option>
                    <option value="2">Two</option>
                    <option value="3">Three</option>
                </select>
            </div>

            <!--
                A number type input element. (integer answer)
                Assign both the name and id attribute values as "q4".
            -->
            <div class="form-row">
                <label for="q4"><span>4.</span> What is the bottom margin given in this declaration?</label>
                <p class="css-box">
                    margin: 10px 5px 15px;
                </p>
                <input type="number" id="q4" name="q4">
            </div>


            <button class="submit" type="submit">Submit</button>
        </form>

    </main>
</body>

</html>
